name: carebridge

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: carebridge
      POSTGRES_USER: ${CAREBRIDGE_DB_USER:-carebridge}
      POSTGRES_PASSWORD: ${CAREBRIDGE_DB_PASSWORD:?set CAREBRIDGE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    profiles: ["api"]
    environment:
      CAREBRIDGE_ENV: local
      CAREBRIDGE_DB_URL: jdbc:postgresql://postgres:5432/carebridge
      CAREBRIDGE_DB_USER: ${CAREBRIDGE_DB_USER:-carebridge}
      CAREBRIDGE_DB_PASSWORD: ${CAREBRIDGE_DB_PASSWORD}
      CAREBRIDGE_REDIS_HOST: redis
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      CAREBRIDGE_DEMO_SEED: ${CAREBRIDGE_DEMO_SEED:-false}
      CAREBRIDGE_DEMO_SEED_FILE: /app/seed/demo-seed.json
      CAREBRIDGE_DEMO_PASSWORD: ${CAREBRIDGE_DEMO_PASSWORD:-}
      CAREBRIDGE_SECURE_COOKIES: ${CAREBRIDGE_SECURE_COOKIES:-false}
    volumes:
      - ./packages/synthetic-data/seed/demo-seed.json:/app/seed/demo-seed.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
