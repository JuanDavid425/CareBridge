# Context tests run without PostgreSQL or Redis; migrations and JDBC stores are covered by *IT tests.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState

carebridge:
  environment: test
  ai-provider: mock
  identity:
    # In-memory accounts from testsupport.TestIdentityConfig; JdbcIdentityStore is covered by IdentityStoreIT.
    store: memory
  demo:
    enabled: false
