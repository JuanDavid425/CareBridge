spring:
  application:
    name: carebridge-api
  datasource:
    url: ${CAREBRIDGE_DB_URL:jdbc:postgresql://localhost:5432/carebridge}
    username: ${CAREBRIDGE_DB_USER:carebridge}
    password: ${CAREBRIDGE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Forward-only migrations: see apps/api/README.md#migrations
    clean-disabled: true
    validate-migration-naming: true
  data:
    redis:
      host: ${CAREBRIDGE_REDIS_HOST:localhost}
      port: ${CAREBRIDGE_REDIS_PORT:6379}

server:
  port: ${CAREBRIDGE_API_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

carebridge:
  environment: ${CAREBRIDGE_ENV:local}
  ai-provider: ${AI_PROVIDER:mock}

logging:
  level:
    root: INFO
