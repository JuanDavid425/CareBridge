spring:
  application:
    name: carebridge-api
  datasource:
    url: ${CAREBRIDGE_DB_URL:jdbc:postgresql://localhost:5432/carebridge}
    username: ${CAREBRIDGE_DB_USER:carebridge}
    password: ${CAREBRIDGE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Forward-only migrations: see apps/api/README.md#migrations
    clean-disabled: true
    validate-migration-naming: true
  data:
    redis:
      host: ${CAREBRIDGE_REDIS_HOST:localhost}
      port: ${CAREBRIDGE_REDIS_PORT:6379}

server:
  port: ${CAREBRIDGE_API_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CAREBRIDGE_SESSION
        http-only: true
        same-site: lax
        # true behind HTTPS (staging/demo); false only for http://localhost
        secure: ${CAREBRIDGE_SECURE_COOKIES:false}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

carebridge:
  environment: ${CAREBRIDGE_ENV:local}
  ai-provider: ${AI_PROVIDER:mock}
  identity:
    store: jdbc
  demo:
    # Loads care units, demo accounts and memberships from the synthetic seed on startup.
    enabled: ${CAREBRIDGE_DEMO_SEED:false}
    seed-file: ${CAREBRIDGE_DEMO_SEED_FILE:../../packages/synthetic-data/seed/demo-seed.json}
    password: ${CAREBRIDGE_DEMO_PASSWORD:}

logging:
  level:
    root: INFO
  pattern:
    # X-Request-Id of the current request (RequestIdFilter)
    correlation: "[%X{requestId:-}] "
